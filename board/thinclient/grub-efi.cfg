# GRUB-конфиг для UEFI-загрузки (кладётся в EFI/BOOT/grub.cfg).
# Ищем раздел с ядром, где бы он ни был (FAT-раздел флешки или ISO),
# и грузимся без меню. vga= тут не нужен: под UEFI консоль рисует
# GOP-framebuffer (efifb) в нативном разрешении.
set timeout=0
search --no-floppy --set=root --file /bzImage
linux ($root)/bzImage console=tty2 vt.default_utf8=1 quiet loglevel=1 consoleblank=600
initrd ($root)/initrd.gz
boot
