# X всегда поверх framebuffer (fbdev): разрешение уже выставил KMS-драйвер
# (i915/gma500/nouveau/radeon/virt) или VESA, ускорение RDP-клиенту не нужно.
# Без этого X пробует modesetting/glamor и на части карт (nouveau) виснет
# чёрным экраном.
Section "Device"
    Identifier "framebuffer"
    Driver "fbdev"
EndSection

# Киоск: из полноэкранной RDP-сессии нельзя переключить VT (Ctrl+Alt+F1..F6)
# и убить X (Ctrl+Alt+Backspace). tty2 остаётся доступен из МЕНЮ, не из
# сессии. Грязный выход X страхует `chvt 1` в tc-menu.
Section "ServerFlags"
    Option "DontVTSwitch" "true"
    Option "DontZap"      "true"
EndSection
