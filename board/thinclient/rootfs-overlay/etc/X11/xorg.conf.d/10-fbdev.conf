# X всегда поверх framebuffer (fbdev): разрешение уже выставил KMS-драйвер
# (i915/gma500/nouveau/radeon/virt) или VESA, ускорение RDP-клиенту не нужно.
# Без этого X пробует modesetting/glamor и на части карт (nouveau) виснет
# чёрным экраном.
Section "Device"
    Identifier "framebuffer"
    Driver "fbdev"
EndSection
