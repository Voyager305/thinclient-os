DEFAULT thinclient
PROMPT 0
TIMEOUT 10

LABEL thinclient
    KERNEL /bzImage
    INITRD /initrd.gz
    # console=tty2: весь текст загрузки уходит на отладочную консоль,
    # tty1 остаётся чистым — заставка psplash, потом меню
    APPEND console=tty2 vt.default_utf8=1 quiet loglevel=1
    # Если консоль не появилась (редкий BIOS без KMS-драйвера под чип) —
    # добавь в APPEND: vga=791  (VESA-framebuffer 1024x768)
